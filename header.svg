<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 65 900 140" width="900" height="140" role="img" aria-label="Animated greeting">
  <defs>
    <clipPath id="typeClip">
      <rect x="180" y="124" height="60" width="0">
        <animate attributeName="width" values="0;0;540;540;0" keyTimes="0;0.08;0.5;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- code block -->
  <g font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="24">
    <text x="180" y="118" fill="#7d8590" opacity="0">
      <tspan fill="#c792ea">using</tspan> <tspan fill="#82aaff">System</tspan><tspan fill="#89ddff">;</tspan>
      <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.03;0.1;0.92;1" dur="9s" repeatCount="indefinite"/>
    </text>

    <g clip-path="url(#typeClip)">
      <text x="180" y="164" textLength="540" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">
        <tspan fill="#ffcb6b">Console</tspan><tspan fill="#89ddff">.</tspan><tspan fill="#82aaff">WriteLine</tspan><tspan fill="#89ddff">(</tspan><tspan fill="#c3e88d">"Привет, мир!"</tspan><tspan fill="#89ddff">);</tspan>
      </text>
    </g>

    <!-- cursor -->
    <rect y="139" width="3" height="32" fill="#ffffff" rx="1">
      <animate attributeName="x" values="180;180;720;720;180" keyTimes="0;0.08;0.5;0.92;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
