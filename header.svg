<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Animated greeting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.55" stop-color="#1a1038"/>
      <stop offset="1" stop-color="#2b0f4a"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a3bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b82ff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c04dff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b6bff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="typeClip">
      <rect x="180" y="124" height="60" width="0">
        <animate attributeName="width" values="0;0;540;540;0" keyTimes="0;0.08;0.5;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="900" height="320" fill="url(#bg)"/>

  <!-- aurora blobs -->
  <circle r="120" fill="#7a3bff" opacity="0.45" filter="url(#blur)">
    <animate attributeName="cx" values="120;320;120" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;200;80" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="110" fill="#3b82ff" opacity="0.35" filter="url(#blur)">
    <animate attributeName="cx" values="780;560;780" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;230;90" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- code block -->
  <g font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="24">
    <text x="180" y="118" fill="#7d8590" opacity="0">
      <tspan fill="#c792ea">using</tspan> <tspan fill="#82aaff">System</tspan><tspan fill="#89ddff">;</tspan>
      <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.03;0.1;0.92;1" dur="9s" repeatCount="indefinite"/>
    </text>

    <g clip-path="url(#typeClip)">
      <text x="180" y="164" textLength="540" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">
        <tspan fill="#ffcb6b">Console</tspan><tspan fill="#89ddff">.</tspan><tspan fill="#82aaff">WriteLine</tspan><tspan fill="#89ddff">(</tspan><tspan fill="#c3e88d">"Привет, мир!"</tspan><tspan fill="#89ddff">);</tspan>
      </text>
    </g>

    <!-- cursor -->
    <rect y="139" width="3" height="32" fill="#ffffff" rx="1">
      <animate attributeName="x" values="180;180;720;720;180" keyTimes="0;0.08;0.5;0.92;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- waves -->
  <g>
    <path fill="url(#wave2)" d="M0 262 q112.5 -34 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V320 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-900 0" to="0 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#wave1)" d="M0 282 q112.5 -30 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V320 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
